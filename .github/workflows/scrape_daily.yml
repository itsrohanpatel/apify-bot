name: 24H LinkedIn Lead Extractor & Analytics

on:
  schedule:
    # Runs at 13:28 UTC (6:58 PM IST) on odd days of the month (1, 3, 5, 7, 9, ...)
    - cron: '28 13 1-31/2 * *'
  workflow_dispatch:
    inputs:
      limit_queries:
        description: 'Number of queries to run (0 = all queries in sheet)'
        required: false
        default: '0'

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check Schedule Filter (Skip Sunday)
        id: check_schedule
        run: |
          # date +%u gives 1 (Monday) to 7 (Sunday)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%u)" -eq 7 ]; then
            echo "run_job=false" >> "$GITHUB_OUTPUT"
            echo "Today is Sunday. Skipping scheduled extraction."
          else
            echo "run_job=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.check_schedule.outputs.run_job == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_schedule.outputs.run_job == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.check_schedule.outputs.run_job == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Lead Extraction Pipeline
        if: steps.check_schedule.outputs.run_job == 'true'
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          LIMIT_QUERIES: ${{ github.event.inputs.limit_queries || '0' }}
        run: |
          python main.py

      - name: Upload Local Backup Artifacts
        uses: actions/upload-artifact@v4
        if: always() && steps.check_schedule.outputs.run_job == 'true'
        with:
          name: linkedin-leads-backup-${{ github.run_number }}
          path: |
            leads_database.csv
            daily_analytics.csv
          if-no-files-found: ignore
          retention-days: 30
